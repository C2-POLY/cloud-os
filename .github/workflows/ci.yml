name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: cloudos
          POSTGRES_PASSWORD: cloudos
          POSTGRES_DB: cloudos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudos -d cloudos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EXTERNAL_DB: "1"
      CLOUDOS_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.10"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      # libheif for the worker's HEIC tests, decoders only, as in worker/Dockerfile.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libheif1 libheif-plugin-libde265 zlib1g-dev
      # The worker's LGPL ffmpeg for the video tests, built by the same script as
      # worker/Dockerfile and cached until that script changes.
      - uses: actions/cache@v4
        with:
          path: .tools/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('worker/ffmpeg/build.sh') }}
      - run: make ffmpeg
      - run: make deps
      - run: make lint
      - run: make test
        env:
          CLOUDOS_REQUIRE_FFMPEG: "1"
