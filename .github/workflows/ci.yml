name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: cloudos
          POSTGRES_PASSWORD: cloudos
          POSTGRES_DB: cloudos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudos -d cloudos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EXTERNAL_DB: "1"
      CLOUDOS_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.10"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make deps
      - run: make lint
      - run: make test
