[project]
name = "cloud-os-worker"
version = "0.1.0"
description = "Cloud OS background worker: AI and indexing tasks read from the Postgres task queue."
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
