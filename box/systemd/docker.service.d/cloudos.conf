# Installed by scripts/install as /etc/systemd/system/docker.service.d/cloudos.conf
# (docs/architecture/box.md, « Installation et démarrage »).
#
# Docker starts only once the folder of the box's data is mounted. Without the
# data SSD, docker.service fails and no container starts: nothing creates
# /srv/cloudos/files on the system's SD card in its place. On a box whose data
# stays on the system disk, the system disk is all this asks for.
[Unit]
RequiresMountsFor=/srv/cloudos
