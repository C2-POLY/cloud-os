# Development stack. Credentials here are local-only defaults for a throwaway database.
# Run several worktrees side by side with their own COMPOSE_PROJECT_NAME and CLOUDOS_*_PORT.
name: cloud-os

x-database-url: &database-url postgres://cloudos:cloudos@db:5432/cloudos?sslmode=disable
# The password of the smb service's own database role, cloudos_smb (migration
# 0026, docs/architecture/smb.md): the core sets it, the smb service logs in
# with it. The default is for the local throwaway database only, like cloudos/cloudos.
x-smb-db-password: &smb-db-password ${CLOUDOS_SMB_DB_PASSWORD:-cloudos-smb}
# The password of the backup service's database role, cloudos_backup
# (migration 0028, docs/architecture/backup.md), the same way.
x-backup-db-password: &backup-db-password ${CLOUDOS_BACKUP_DB_PASSWORD:-cloudos-backup}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: cloudos
      POSTGRES_PASSWORD: cloudos
      POSTGRES_DB: cloudos
    ports:
      - "127.0.0.1:${CLOUDOS_DB_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudos -d cloudos"]
      interval: 2s
      timeout: 5s
      retries: 30

  core:
    build: &core-build
      context: .
      dockerfile: core/Dockerfile
    environment:
      DATABASE_URL: *database-url
      CLOUDOS_DATA_DIR: /data
      MAPS_DIR: /maps
      # The worker's query endpoint (POST /embed), on the Compose network only.
      WORKER_URL: http://worker:8090
      CLOUDOS_SMB_DB_PASSWORD: *smb-db-password
      CLOUDOS_BACKUP_DB_PASSWORD: *backup-db-password
    ports:
      - "127.0.0.1:${CLOUDOS_CORE_PORT:-8480}:8080"
    volumes:
      # User files, in clear: <data dir>/<owner>/<path>, readable from the host.
      - ${CLOUDOS_DATA_DIR:-./.data/files}:/data
      # The Photos map's tiles: a .pmtiles file, read only (docs/architecture/map.md).
      - ${CLOUDOS_MAPS_DIR:-./.data/maps}:/maps:ro
    # The image has no shell: the core asks itself (`core health`).
    healthcheck:
      test: ["CMD", "/core", "health"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      db:
        condition: service_healthy

  # The drives over SMB (docs/architecture/smb.md), each account with its SMB
  # password, written through storage like WebDAV. Off by default: `CLOUDOS_SMB=1 make up` turns the
  # profile on. A process of its own, the core's image with `core smb`, with
  # its own memory limit: if SMB falls, the core and the web stay up.
  smb:
    build: *core-build
    command: ["smb"]
    profiles: [smb]
    environment:
      # Its own role, never the core's: it reads accounts and SMB passwords,
      # notes an SMB password's last use, and writes only what storage needs
      # (migration 0027), never the accounts nor the sessions. The password goes apart, so no character of it needs escaping in the URL.
      DATABASE_URL: postgres://cloudos_smb@db:5432/cloudos?sslmode=disable
      PGPASSWORD: *smb-db-password
      CLOUDOS_DATA_DIR: /data
      CLOUDOS_SMB: ${CLOUDOS_SMB:-}
      # The Go runtime collects well before the container's limit.
      GOMEMLIMIT: 384MiB
    ports:
      # macOS's own file sharing holds port 445 on the Mac, hence 1445.
      - "127.0.0.1:${CLOUDOS_SMB_PORT:-1445}:445"
    volumes:
      # Written only through storage, as the core writes it (#92).
      - ${CLOUDOS_DATA_DIR:-./.data/files}:/data
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy

  # The nightly encrypted backup (docs/architecture/backup.md): restic into
  # ${CLOUDOS_BACKUP_DIR}, a USB disk on the box. Off by default: the Compose
  # profile `backup` (CLOUDOS_BACKUP=1 make up; scripts/box turns it on once
  # backup-init has run). Its image holds pg_dump and Postgres of the
  # database's version, restic and the core's binary.
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
      target: backup
    command: ["backup", "daemon"]
    profiles: [backup]
    environment:
      # Its own role: it reads the whole database (pg_dump) and writes
      # backup_runs, nothing else. The password goes apart, as for smb.
      DATABASE_URL: postgres://cloudos_backup@db:5432/cloudos?sslmode=disable
      PGPASSWORD: *backup-db-password
      CLOUDOS_DATA_DIR: /data
      CLOUDOS_BACKUP_DIR: /backup
      RESTIC_REPOSITORY: /backup/restic
      # The repository's key. The default is for a development repository
      # only: compose.prod.yaml requires the box's own (scripts/box backup-init).
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-cloudos-backup-dev}
      CLOUDOS_BACKUP_AT: ${CLOUDOS_BACKUP_AT:-03:00}
      TZ: ${CLOUDOS_TZ:-Europe/Paris}
      # A second repository, copied to after each run: empty, nothing leaves the box.
      CLOUDOS_BACKUP_REMOTE: ${CLOUDOS_BACKUP_REMOTE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      GOMEMLIMIT: 256MiB
    volumes:
      # Read and written, for storage's hard links under .cloudos/snapshots
      # only (Freeze, Release), and for a full restore onto a new box.
      - ${CLOUDOS_DATA_DIR:-./.data/files}:/data
      - ${CLOUDOS_BACKUP_DIR:-./.data/backup}:/backup
      # restic's cache of the repository's index, rebuilt if lost.
      - backup_cache:/cache
    mem_limit: 1g
    pids_limit: 256
    depends_on:
      core:
        condition: service_healthy

  worker:
    build: worker
    environment:
      DATABASE_URL: *database-url
      WORKER_ID: python # role prefix; the id adds the container and process
      CLOUDOS_DATA_DIR: /data
    # Port 8090 serves the core the vectors of searches (POST /embed). It is
    # reachable on the Compose network only: never add it to `ports`.
    expose:
      - "8090"
    volumes:
      # Read-only: workers write their results to the database, never to the files.
      - ${CLOUDOS_DATA_DIR:-./.data/files}:/data:ro
    depends_on:
      db:
        condition: service_healthy

  # Vite dev server with hot reload; forwards /api to the core.
  web:
    image: node:24-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      VITE_API_TARGET: http://core:8080
    ports:
      - "127.0.0.1:${CLOUDOS_WEB_PORT:-5180}:5173"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - core

volumes:
  pgdata:
  web_node_modules:
  backup_cache:
